<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="trackerstyle.css">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        
        <a href="index.html"><h4>Home</h4></a>
        <h4>AI Insigts</h4>
      
    </nav>
    <div class="controls">
    <input type="text" placeholder="Enter IP on ESP32">
    <button>CONNECT</button>
    </div>
    <div>
     <div class="grid-container" style="display: grid">
  <div class="chart-container" style="min-width: 0">
    <canvas id="myChart"></canvas>
  </div>
</div>
</div>

</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 <!--code is taken from chart js setup webpage-->

<script>
    
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
</html>
